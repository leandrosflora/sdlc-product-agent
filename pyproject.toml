[project]
name = "sdlc-product-agent"
version = "0.1.0"
description = "Operational agent implementing agent_role == \"product\" from the agentic-sdlc-reference-architecture."
requires-python = ">=3.11"
dependencies = [
  "agentic-sdlc-runtime @ git+https://github.com/leandrosflora/agentic-sdlc-runtime.git@v0.2.0"
]

[project.scripts]
sdlc-product-issue = "sdlc_product_agent.github_issue:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sdlc_product_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
